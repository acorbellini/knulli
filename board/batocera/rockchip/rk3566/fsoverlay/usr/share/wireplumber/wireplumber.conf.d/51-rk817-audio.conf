# Force the RK817 codec to use the stereo profile instead of pro-audio.
# Without this, WirePlumber selects the pro-audio profile which creates an
# 8-channel sink that doesn't drive the speakers.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card._sys_devices_platform_rk817-sound_sound_card0"
      }
    ]
    actions = {
      update-props = {
        api.acp.auto-profile = true
        api.acp.auto-port = true
      }
    }
  }
]
