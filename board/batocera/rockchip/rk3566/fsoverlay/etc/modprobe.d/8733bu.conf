# RTL8733BU WiFi power management
# rtw_power_mgnt=1: enable 802.11 power save (radio sleeps between beacons)
# rtw_ips_mode=0: disable idle power save (don't power down radio when idle)
# rtw_enusbss=0: disable USB selective suspend to prevent WiFi disconnections
options 8733bu rtw_power_mgnt=1 rtw_ips_mode=0 rtw_enusbss=0
