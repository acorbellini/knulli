/* Miyoo Flip (RK3566) — genimage configuration
 *
 * The Miyoo Flip uses stock GammaOS U-Boot from SPI flash + boot_android.
 * No U-Boot images are included here. This produces a basic image with
 * BATOCERA and SHARE partitions at the correct offsets for the Miyoo Flip
 * partition layout.
 *
 * For a full flashable image (with GammaOS proprietary boot data and
 * patched boot.img), use create-disk-image.py after building.
 */

image boot.vfat {
	vfat {
		extraargs = "-F 32 -n BATOCERA"
		@files
	}
	size = 4G
}

image userdata.ext4 {
	ext4 {
		label = "SHARE"
		use-mke2fs = "true"
		extraargs = "-m 0"
	}
	size = "512M"
	mountpoint = "/userdata"
}

image batocera.img {
	hdimage {
		align = "1M"
	}

	/* BATOCERA at 76M (sector 155648) — after the GammaOS boot partition */
	partition vfat {
		partition-type = 0xC
		image = "boot.vfat"
		offset = 76M
	}

	partition userdata {
		partition-type = 0x83
		image = "userdata.ext4"
	}
}

